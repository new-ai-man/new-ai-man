<svg width="780" height="130" viewBox="0 0 780 130" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" role="img" aria-label="AI Superset Agent terminal banner">
  <!-- 终端窗口背景 -->
  <rect x="0" y="0" width="780" height="130" rx="10" fill="#0D1117"/>
  <rect x="0" y="0" width="780" height="28" rx="10" fill="#161B22"/>
  <!-- 窗口控制点 -->
  <circle cx="20" cy="14" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="14" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="14" r="6" fill="#27C93F"/>
  <text x="390" y="19" font-size="12" fill="#8B949E" text-anchor="middle">new-ai-man@macbook: ~/superset-agent</text>

  <!-- 行1: 命令提示符 -->
  <text x="20" y="58" font-size="18" fill="#3FB950">$ ./bootstrap.sh</text>
  <!-- 行1 光标 -->
  <rect x="190" y="42" width="10" height="22" fill="#F78166">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- 行2: 打字机效果 -->
  <text x="20" y="86" font-size="20" fill="#58A6FF" opacity="0">AI
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.8s" fill="freeze"/>
  </text>
  <text x="55" y="86" font-size="20" fill="#58A6FF" opacity="0">SUPERSET
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.1s" fill="freeze"/>
  </text>
  <text x="175" y="86" font-size="20" fill="#58A6FF" opacity="0">AGENT
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.4s" fill="freeze"/>
  </text>
  <!-- 行2 光标 -->
  <rect x="240" y="70" width="10" height="24" fill="#F78166" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- 行3: 状态行 -->
  <text x="20" y="114" font-size="15" fill="#8B949E" opacity="0">MODE:
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.2s" fill="freeze"/>
  </text>
  <text x="90" y="114" font-size="15" fill="#3FB950" opacity="0">BUILD_IN_PUBLIC
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.4s" fill="freeze"/>
  </text>
  <text x="255" y="114" font-size="15" fill="#8B949E" opacity="0">· REVENUE:
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.8s" fill="freeze"/>
  </text>
  <text x="380" y="114" font-size="15" fill="#F78166" opacity="0">$0
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.0s" fill="freeze"/>
  </text>
  <!-- 行3 光标 -->
  <rect x="410" y="100" width="9" height="20" fill="#F78166" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
